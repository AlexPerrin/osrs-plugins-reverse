name: CodeQL

# Advanced setup. Scope: all first-party code; vendored dependencies (server/rsprot,
# native/third_party) are left to their upstreams.
#   java (no build)  host/, tools/: host/build.sh needs the Android SDK and re/ jars, not in CI;
#                    server/ is removed first so autodetection does not try its Gradle build
#   server (manual)  server/src Kotlin: rsprot is compiled before CodeQL starts tracing, so only
#                    the server is extracted
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python
            language: python
            build-mode: none
          - name: c-cpp
            language: c-cpp
            build-mode: none
          - name: java
            language: java-kotlin
            build-mode: none
          - name: server-kotlin
            language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v4

      # server/ holds no Java (server-kotlin covers it); left in, buildless autodetection runs
      # Gradle on it without a wrapper or rsprot and fails the classpath and dependency-graph steps.
      - if: matrix.name == 'java'
        run: rm -rf server

      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # Untraced: builds rsprot (an included build that the root project's clean leaves alone).
      - if: matrix.build-mode == 'manual'
        working-directory: server
        run: |
          scripts/rsprot.sh init
          gradle --no-daemon --console=plain classes

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - native/third_party
              - server/rsprot

      - if: matrix.build-mode == 'manual'
        working-directory: server
        run: gradle --no-daemon --console=plain --no-build-cache -Pkotlin.compiler.execution.strategy=in-process clean classes

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.name }}"
