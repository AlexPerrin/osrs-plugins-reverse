name: CodeQL

# Advanced setup: the default setup's Autobuild cannot build server/, because settings.gradle.kts
# includes server/rsprot, which is gitignored and has to be cloned by scripts/rsprot.sh first.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@v4

      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.build-mode == 'manual'
        working-directory: server
        run: |
          scripts/rsprot.sh init
          gradle --no-daemon --console=plain --no-build-cache classes

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
