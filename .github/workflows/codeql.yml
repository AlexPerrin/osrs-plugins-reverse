name: CodeQL

# Advanced setup. Scope: all first-party code in this repo (the client and its APK releases); the vendored
# dependency native/third_party is left to its upstream. Server code is analysed in the OpenRune fork.
#   java (no build)  host/, tools/: host/build.sh needs the Android SDK and re/ jars, not in CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python
            language: python
            build-mode: none
          - name: c-cpp
            language: c-cpp
            build-mode: none
          - name: java
            language: java-kotlin
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - native/third_party

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.name }}"
